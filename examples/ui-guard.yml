# Copy to .github/workflows/ui-guard.yml in the repository you want reviewed.
name: UI Guard

on:
  pull_request:
    paths: ["**/*.tsx", "**/*.jsx", "**/*.css"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the diff needs the base branch
      - uses: hasbynatawijaya/ui-guard@main
        with:
          # Optional: add this secret to turn on the Claude review.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
